<style>
  :root {
    --bg: #000;
    --fg: #00ff41;
    --halo: #e8d9a0;
    --blood: #ff0040;
    --dim: #0b3d17;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 13px/1.25 "Courier New", ui-monospace, monospace;
    cursor: crosshair;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

  #liturgy {
    position: fixed; left: 16px; top: 16px; right: 16px;
    pointer-events: none; white-space: pre-wrap; mix-blend-mode: difference;
    text-transform: uppercase; letter-spacing: .08em;
  }
  #liturgy b { color: var(--halo); font-weight: normal; }

  nav {
    position: fixed; left: 16px; bottom: 16px;
    display: flex; flex-direction: column; gap: 4px; z-index: 5;
  }
  nav a {
    color: var(--fg); text-decoration: none; background: #000;
    padding: 1px 6px; border: 1px solid transparent; width: max-content;
  }
  nav a:hover { color: #000; background: var(--fg); }
  nav a::before { content: "[" attr(data-n) "] "; color: var(--dim); }
  nav a:hover::before { color: #000; }

  #prayer {
    position: fixed; right: 16px; bottom: 16px; z-index: 5;
    color: var(--halo); text-align: right; max-width: 60vw;
    word-break: break-all;
  }
  #prayer::after { content: "█"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .win {
    position: fixed; z-index: 10; min-width: 260px; max-width: min(460px, calc(100vw - 32px));
    background: #000; border: 1px solid var(--fg);
    box-shadow: 6px 6px 0 var(--dim);
  }
  .win header {
    display: flex; justify-content: space-between; gap: 12px;
    background: var(--fg); color: #000; padding: 2px 6px; cursor: move; user-select: none;
  }
  .win header button {
    all: unset; cursor: pointer; padding: 0 4px;
  }
  .win header button:hover { background: #000; color: var(--fg); }
  .win .body { padding: 10px; max-height: 50vh; overflow: auto; }
  .win .body a { color: var(--halo); }
  .win.sacred { border-color: var(--halo); box-shadow: 6px 6px 0 #3a3420; }
  .win.sacred header { background: var(--halo); }


  /* arrival: the black of the door lifts (sits under the cursor, above everything else) */
  #arrive {
    position: fixed; inset: 0; z-index: 2147482000; background: #000; pointer-events: none;
    animation: lift 1.1s ease-out .05s forwards;
  }
  @keyframes lift { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #arrive { animation-duration: .01s; } }

  body.schism { filter: invert(1) hue-rotate(90deg); }
  body.schism #liturgy { transform: skewX(-12deg) translateX(20px); }
</style>

<script>
(() => {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const GLYPHS = '†✝☩∴∵◊ΩΨ01⌘░▒▓#+*:.';
  const CELL = 14;
  let W, H, cols, rows, t = 0;
  let mx = 0.5, my = 0.5;
  let palette = ['#00ff41', '#e8d9a0'];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / CELL); rows = Math.ceil(H / CELL);
    ctx.font = `${CELL - 2}px "Courier New", monospace`;
    ctx.textBaseline = 'top';
  }
  addEventListener('resize', resize); resize();

  // Halo: concentric rings + rotating rays, pulled toward the cursor.
  function field(x, y) {
    const cx = cols * (0.5 + (mx - 0.5) * 0.25);
    const cy = rows * (0.45 + (my - 0.5) * 0.25);
    const dx = (x - cx) / (cols * 0.5);
    const dy = (y - cy) / (rows * 0.5) * (rows / cols) * 2;
    const r = Math.hypot(dx, dy);
    const a = Math.atan2(dy, dx);
    const rings = Math.sin(r * 22 - t * 2.2);
    const rays = Math.sin(a * 12 + t * 0.6 + Math.sin(r * 4 - t));
    const core = Math.exp(-r * r * 60);
    return (rings * 0.6 + rays * 0.5) * Math.exp(-r * 0.7) + core * 2;
  }

  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const v = field(x, y);
        if (v < 0.2) continue;
        const i = Math.min(GLYPHS.length - 1, Math.floor((1 - Math.min(v, 1)) * GLYPHS.length));
        ctx.fillStyle = v > 0.9 ? palette[1] : palette[0];
        ctx.globalAlpha = Math.min(1, v);
        ctx.fillText(GLYPHS[i], x * CELL, y * CELL);
      }
    }
    ctx.globalAlpha = 1;
    t += 0.016;
    requestAnimationFrame(draw);
  }
  draw();

  addEventListener('pointermove', e => { mx = e.clientX / W; my = e.clientY / H; });

  // Liturgy: text that writes itself out of corruption.
  const lines = [
    'IN THE BEGINNING WAS THE <b>PACKET</b>, AND THE PACKET WAS WITH GOD.',
    'Z3PH1R :: ARTIST / DESIGNER / OPERATOR OF RELICS',
    'HALLOWED BE THY BANDWIDTH.',
    'PING 127.0.0.1 ... <b>SOMEONE ANSWERS</b>.',
  ];
  const lit = document.getElementById('liturgy');
  let li = 0;
  function corrupt(s, p) {
    return s.replace(/[A-Z]/g, ch => Math.random() < p ? GLYPHS[(Math.random() * GLYPHS.length) | 0] : ch);
  }
  function speak() {
    const line = lines[li++ % lines.length];
    let p = 1;
    const iv = setInterval(() => {
      p -= 0.08;
      lit.innerHTML = corrupt(line, Math.max(p, 0));
      if (p <= 0) clearInterval(iv);
    }, 45);
  }
  speak(); setInterval(speak, 5200);

  // Draggable windows, JODI-style: they pile up, they make a mess.
  let z = 10;
  function openWin(name, echo) {
    const tpl = document.getElementById('t-' + name);
    const w = document.createElement('div');
    w.className = 'win' + (name === 'dogma' ? ' sacred' : '');
    w.innerHTML = `<header><span>${name}.sys</span><button aria-label="close">×</button></header><div class="body"></div>`;
    w.querySelector('.body').append(tpl.content.cloneNode(true));
    const maxX = Math.max(16, innerWidth - 480), maxY = Math.max(16, innerHeight - 300);
    w.style.left = (16 + Math.random() * maxX) + 'px';
    w.style.top = (60 + Math.random() * (maxY - 44)) + 'px';
    w.style.zIndex = ++z;
    document.body.append(w);
    w.addEventListener('pointerdown', () => (w.style.zIndex = ++z));
    w.querySelector('button').onclick = () => w.remove();
    drag(w, w.querySelector('header'));
    if (name === 'error' && !echo) {
      for (let k = 0; k < 7; k++) setTimeout(() => openWin('error', true), 120 * (k + 1));
      schism(900);
    }
  }
  function drag(el, handle) {
    handle.addEventListener('pointerdown', e => {
      if (e.target.tagName === 'BUTTON') return;
      const ox = e.clientX - el.offsetLeft, oy = e.clientY - el.offsetTop;
      const mv = ev => { el.style.left = ev.clientX - ox + 'px'; el.style.top = ev.clientY - oy + 'px'; };
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    });
  }
  document.querySelectorAll('nav a[data-open]').forEach(a =>
    a.addEventListener('click', e => { e.preventDefault(); openWin(a.dataset.open); }));

  // Schism: clicking the void breaks the page for an instant.
  function schism(ms) {
    document.body.classList.add('schism');
    palette = palette.slice().reverse();
    setTimeout(() => document.body.classList.remove('schism'), ms);
  }
  c.addEventListener('click', () => schism(180));

  // Prayer: what you type stays written. "amen" opens the offering.
  const pr = document.getElementById('prayer');
  let buf = '';
  addEventListener('keydown', e => {
    if (e.key.length !== 1) return;
    buf = (buf + e.key).slice(-80);
    pr.textContent = buf;
    if (/amen$/i.test(buf)) { openWin('offering'); buf = ''; pr.textContent = '✝'; }
  });

  // Arrival: the black of the door lifts to reveal the temple.
  const arrive = document.getElementById('arrive');
  arrive.addEventListener('animationend', () => arrive.remove());
  setTimeout(() => arrive.remove(), 2500);        // safety net if the animation event never fires

  // The tab title prays too.
  const tt = ['Z3PH1R', 'Z3PH1R ✝', 'Z̷3̷P̷H̷1̷R̷', '☩ ORA PRO NOBIS ☩', 'Z3PH1R'];
  let ti = 0; setInterval(() => (document.title = tt[ti++ % tt.length]), 1400);

  console.log('%c✝ welcome to the confessional. ✝', 'color:#e8d9a0;background:#000;font-size:16px;padding:6px');
})();
</script>
